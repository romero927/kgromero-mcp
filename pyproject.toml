[project]
name = "kgromero-mcp"
version = "0.1.0"
description = "MCP server for kgromero.com: Kyle Romero's resume, experience, skills, and contact info"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kyle Romero", email = "kgromero@gmail.com" }]
dependencies = ["mcp>=2.3,<3", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://kgromero.com"

[project.scripts]
kgromero-mcp = "kgromero_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kgromero_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
