[project]
name = "kgromero-mcp"
version = "0.2.0"
description = "MCP server for kgromero.com: Kyle Romero's resume, experience, skills, and contact info"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "model-context-protocol", "resume", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Communications",
]
authors = [{ name = "Kyle Romero", email = "kgromero@gmail.com" }]
dependencies = ["mcp>=2.3,<3", "httpx>=0.27", "pypdfium2>=4.30", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://kgromero.com/api-docs#mcp"
Repository = "https://github.com/romero927/kgromero-mcp"

[project.scripts]
kgromero-mcp = "kgromero_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kgromero_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
